description: >-
  FinOps view of Bannerbear spend. Bannerbear bills a flat monthly
  subscription per plan, each bundling a fixed pool of image/video API credits
  and a bandwidth allowance. Cost is driven by which plan tier an account sits
  on and how many credits and how much bandwidth are consumed within it; PDF
  rendering consumes extra credits (3x). Because monthly credits are a hard cap
  rather than metered overage, cost optimization centers on right-sizing the
  plan tier and minimizing wasted renders.
notes: >-
  Plan prices and credit pools are subject to change; verify against the
  Bannerbear pricing page during reconciliation.
sources:
- https://www.bannerbear.com/pricing/
- https://developers.bannerbear.com/
- https://focus.finops.org/focus-specification/v1-3/
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
