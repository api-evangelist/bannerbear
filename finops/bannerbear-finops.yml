publisherName: Bannerbear
serviceCategory: Media and Content
billingModel:
  pricingCategory: Subscription
  billingFrequency: Monthly
  billingCurrency: USD
  chargeCategories:
  - Subscription
  - Usage
focusColumns:
  ServiceName: Bannerbear
  ServiceCategory: Media and Content
  ProviderName: Bannerbear
  PublisherName: Bannerbear
  InvoiceIssuerName: Bannerbear
  BillingCurrency: USD
