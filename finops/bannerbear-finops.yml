  PricingCategory: Subscription
meters:
- name: plan_subscription
  description: Flat monthly subscription fee for the active plan tier.
  unit: months
  aggregation: sum
  dimensions:
  - account
  - plan
- name: api_credits
  description: Image/video API credits consumed; one image, video, collection image, animated GIF, or screenshot generally consumes one credit.
  unit: credits
  aggregation: sum
  dimensions:
  - account
  - project
  - resource_type
- name: pdf_render_credits
  description: Additional credits consumed when render_pdf is enabled (3x the standard credit cost).
  unit: credits
  aggregation: sum
  dimensions:
  - account
  - project
- name: bandwidth
  description: Bandwidth served from generated media against the plan's monthly allowance.
  unit: gigabytes
  aggregation: sum
  dimensions:
  - account
  - project
principles:
- name: Visibility
  description: Pull account quota and usage from GET /v2/account; track credits and bandwidth consumed per project against the plan allowance.
- name: Allocation
  description: Scope API keys per project/workload and tag rendered resources with metadata to map credits back to teams or campaigns.
- name: Optimization
  description: Right-size the plan tier to actual credit demand; avoid unnecessary PDF renders (3x cost); cache and reuse generated assets; batch via collections instead of many single-image calls.
- name: Accountability
  description: Assign owners per project; review monthly credit and bandwidth burn before the hard cap forces an unplanned upgrade.
maintainers:
