specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Bannerbear
providerId: bannerbear
created: '2026-06-20'
modified: '2026-06-20'
reconciled: true
tags:
- Image Generation
- Video Generation
- Templates
- Media
- Automation
- Plans
description: >-
  Bannerbear uses flat monthly subscription tiers, each bundling a fixed number
  of image/video API credits and a bandwidth allowance. One image, video,
  collection image, animated GIF, or screenshot generally consumes one API
  credit; PDF rendering consumes additional credits. Usage cannot exceed the
  monthly credit limit - exceeding it requires upgrading to a higher plan
  rather than paying per-unit overage. A free trial provides 30 credits with no
  credit card.
notes: >-
  Plan prices and credit allotments as published on the Bannerbear pricing
  page; the Enterprise tier scales credits well beyond 20,000 (up to ~2,000,000)
  via custom arrangements. Verify current numbers on the pricing page during
  reconciliation.
sources:
- https://www.bannerbear.com/pricing/
- https://developers.bannerbear.com/
plans:
- id: bannerbear-free-trial
  name: Free Trial
  type: free
  description: >-
    30 API credits to evaluate the API with no credit card required.
  entries:
  - label: Trial Credits
    name: trial_credits
    type: free
    metric: credits
    limit: 30
    timeFrame: lifetime
    geo: global
    unit: 1
    price: $0
    userMultiplied: false
  elements:
  - name: Images
  - name: Videos
  - name: Collections
  - name: Screenshots
  - name: Animated GIFs
- id: bannerbear-automate
  name: Automate
  type: subscription
  description: >-
    Entry paid plan with 1,000 image/video API credits and 10 GB bandwidth,
    REST API plus Zapier, Make.com, Airtable, and Forms integrations.
  entries:
  - label: Monthly Subscription
    name: automate_monthly
    type: flat
    metric: subscription
    limit: 1
    timeFrame: month
    geo: global
    unit: 1
    price: $49 per month
    userMultiplied: false
  - label: API Credits
    name: automate_credits
    type: included
    metric: credits
    limit: 1000
    timeFrame: month
    geo: global
    unit: 1
    price: included
    userMultiplied: false
  - label: Bandwidth
    name: automate_bandwidth
    type: included
    metric: gigabytes
    limit: 10
    timeFrame: month
    geo: global
    unit: 1
    price: included
    userMultiplied: false
  elements:
  - name: Images
  - name: Videos
  - name: Collections
  - name: Screenshots
  - name: Animated GIFs
  - name: REST API
- id: bannerbear-scale
  name: Scale
  type: subscription
  description: >-
    Mid-tier plan with 10,000 API credits and 50 GB bandwidth, adding Simple
    URLs, Signed URLs, team members and roles, and priority email support.
  entries:
  - label: Monthly Subscription
    name: scale_monthly
    type: flat
    metric: subscription
    limit: 1
    timeFrame: month
    geo: global
    unit: 1
    price: $149 per month
    userMultiplied: false
  - label: API Credits
    name: scale_credits
    type: included
    metric: credits
    limit: 10000
    timeFrame: month
    geo: global
    unit: 1
    price: included
    userMultiplied: false
  - label: Bandwidth
    name: scale_bandwidth
    type: included
    metric: gigabytes
    limit: 50
    timeFrame: month
    geo: global
    unit: 1
    price: included
    userMultiplied: false
  elements:
  - name: All Automate Features
  - name: Simple URLs
  - name: Signed URLs
  - name: Team Members and Roles
- id: bannerbear-enterprise
  name: Enterprise
  type: enterprise
  description: >-
    Highest tier starting at 20,000 API credits and 100 GB bandwidth, scaling
    credits up to ~2,000,000, with Bring Your Own Storage and Zoom support.
  entries:
  - label: Monthly Subscription
    name: enterprise_monthly
    type: flat
    metric: subscription
    limit: 1
    timeFrame: month
    geo: global
    unit: 1
    price: from $299 per month
    userMultiplied: false
  - label: API Credits
    name: enterprise_credits
    type: included
    metric: credits
    limit: 20000
    timeFrame: month
    geo: global
    unit: 1
    price: included; scales to ~2,000,000
    userMultiplied: false
  - label: Bandwidth
    name: enterprise_bandwidth
    type: included
    metric: gigabytes
    limit: 100
    timeFrame: month
    geo: global
    unit: 1
    price: included
    userMultiplied: false
  elements:
  - name: All Scale Features
  - name: Bring Your Own Storage
  - name: Zoom Support
maintainers:
