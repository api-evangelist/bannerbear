                    - pending
                    - running
                    - completed
                    - failed
                    description: pending → running → completed / failed
                  progress:
                    type: integer
                    minimum: 0
                    maximum: 100
                    description: 0-100 job progress, 100 once completed
                  inputs:
                    type: object
                    description: Inputs the job was created with
                  outputs:
                    type: object
                    properties:
                      image_url:
                        type: string
                        format: uri
                      image_urls:
                        type: string
                        format: uri
                  metadata:
                    type: string
                    nullable: true
                    description: Arbitrary metadata string round-tripped from the create request
                  self:
                    type: string
                    format: uri
                  created_at:
                    type: string
                    format: date-time
                  completed_at:
                    type: string
                    format: date-time
                    nullable: true
                  error_message:
                    type: string
                    nullable: true
                    description: Human-readable failure reason (only present on failed jobs)
        '402':
          description: API quota exhausted — upgrade required
          content:
