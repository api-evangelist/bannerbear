openapi: 3.2.0
info:
  title: Bannerbear V5 Tools API
  version: '5.0'
servers:
- url: https://api.bannerbear.com/v5
  description: Async render host. All endpoints.
- url: https://sync.api.bannerbear.com/v5
  description: Synchronous render host. Only accepts POST /images — returns the finished image inline instead of a pending record. Long-running requests may return 408.
security:
- bearerAuth: []
tags:
- name: Tools
paths:
  /tools/remove_bg:
    post:
      summary: Remove background
      description: Cut the subject out of an image onto transparency. Async — returns 202 with a pending job; poll GET /tool_jobs/{uid} until `status` is `completed` or `failed`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                image_url:
                  description: PNG or JPG source
                  type: string
                  format: uri
                metadata:
                  type: string
                  description: Arbitrary metadata string stored with the tool run
              required:
              - image_url
      responses:
        '202':
          description: Tool run accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  uid:
                    type: string
                  tool:
                    type: string
                    enum:
                    - remove_bg
                  status:
                    type: string
                    enum:
                    - pending
                    - running
                    - completed
                    - failed
                    description: pending → running → completed / failed
                  progress:
                    type: integer
                    minimum: 0
                    maximum: 100
                    description: 0-100 job progress, 100 once completed
                  inputs:
                    type: object
                    description: Inputs the job was created with
                  outputs:
                    type: object
                    properties:
                      image_url:
                        type: string
                        format: uri
                  metadata:
                    type: string
                    nullable: true
                    description: Arbitrary metadata string round-tripped from the create request
                  self:
                    type: string
                    format: uri
                  created_at:
                    type: string
                    format: date-time
                  completed_at:
                    type: string
                    format: date-time
                    nullable: true
                  error_message:
                    type: string
                    nullable: true
                    description: Human-readable failure reason (only present on failed jobs)
        '402':
          description: API quota exhausted — upgrade required
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: Human-readable explanation of the error
        '404':
          description: Unknown tool
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: Human-readable explanation of the error
        '422':
          description: Input validation failure
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: Human-readable explanation of the error
      tags:
      - Tools
      operationId: postToolsRemoveBg
      x-operation-id-source: derived
  /tools/generate_ai_image:
    post:
      summary: Generate AI image
      description: Generate an image from a text prompt with AI. Async — returns 202 with a pending job; poll GET /tool_jobs/{uid} until `status` is `completed` or `failed`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                prompt:
                  description: What to generate — describe the subject, style and composition
                  type: string
                model:
                  description: Costs vary by model — see the credit cost shown for each
                  type: string
                  enum:
                  - flux_schnell
                  - flux_1_1_pro
                  - nano_banana
                  - gpt_image_2
                  default: flux_schnell
                aspect_ratio:
                  description: Defaults to square
                  type: string
                  enum:
                  - '1:1'
                  - '16:9'
                  - '9:16'
                  - '4:3'
                  - '3:4'
                  default: '1:1'
                reference_image_url:
                  description: Optional starting point — only some models accept one
                  type: string
                  format: uri
                metadata:
                  type: string
                  description: Arbitrary metadata string stored with the tool run
              required:
              - prompt
              - model
      responses:
        '202':
          description: Tool run accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  uid:
                    type: string
                  tool:
                    type: string
                    enum:
                    - generate_ai_image
                  status:
                    type: string
                    enum:
                    - pending
                    - running
                    - completed
                    - failed
                    description: pending → running → completed / failed
                  progress:
                    type: integer
                    minimum: 0
                    maximum: 100
                    description: 0-100 job progress, 100 once completed
                  inputs:
                    type: object
                    description: Inputs the job was created with
                  outputs:
                    type: object
                    properties:
                      image_url:
                        type: string
                        format: uri
                  metadata:
                    type: string
                    nullable: true
                    description: Arbitrary metadata string round-tripped from the create request
                  self:
                    type: string
                    format: uri
                  created_at:
                    type: string
                    format: date-time
                  completed_at:
                    type: string
                    format: date-time
                    nullable: true
                  error_message:
                    type: string
                    nullable: true
                    description: Human-readable failure reason (only present on failed jobs)
        '402':
          description: API quota exhausted — upgrade required
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: Human-readable explanation of the error
        '404':
          description: Unknown tool
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: Human-readable explanation of the error
        '422':
          description: Input validation failure
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: Human-readable explanation of the error
      tags:
      - Tools
      operationId: postToolsGenerateAiImage
      x-operation-id-source: derived
  /tools/generate_ai_video:
    post:
      summary: Generate AI video
      description: Generate a video from a prompt or image with AI. Async — returns 202 with a pending job; poll GET /tool_jobs/{uid} until `status` is `completed` or `failed`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                prompt:
                  description: What happens in the clip — describe the subject, motion, camera and style
                  type: string
                model:
                  description: AI credit cost varies by model, length and resolution
                  type: string
                  enum:
                  - seedance_1_lite
                  - seedance_2
                  - kling_2_5_turbo_pro
                  - veo_3_1_fast
                  default: seedance_1_lite
                duration:
                  description: Each model offers some of these lengths — Kling 5 or 10, Veo 4, 6 or 8, Seedance any
                  type: string
                  enum:
                  - 4
                  - 5
                  - 6
                  - 8
                  - 10
                  default: 5
                resolution:
                  description: Higher resolutions cost more per second — Kling's is fixed
                  type: string
                  enum:
                  - 480p
                  - 720p
                  - 1080p
                  default: 720p
                aspect_ratio:
                  description: Ignored when a starting image is given — the clip takes the image's shape
                  type: string
                  enum:
                  - '16:9'
                  - '9:16'
                  - '1:1'
                  - '4:3'
                  - '3:4'
                  default: '16:9'
                image_url:
                  description: Optional — the clip begins from this frame and animates it
                  type: string
                  format: uri
                audio:
                  description: Generated sound, on the models that can — Veo charges less without it
                  type: string
                  enum:
                  - 'on'
                  - 'off'
                  default: 'on'
                metadata:
                  type: string
                  description: Arbitrary metadata string stored with the tool run
              required:
              - prompt
              - model
      responses:
        '202':
          description: Tool run accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  uid:
                    type: string
                  tool:
                    type: string
                    enum:
                    - generate_ai_video
                  status:
                    type: string
                    enum:
                    - pending
                    - running
                    - completed
                    - failed
                    description: pending → running → completed / failed
                  progress:
                    type: integer
                    minimum: 0
                    maximum: 100
                    description: 0-100 job progress, 100 once completed
                  inputs:
                    type: object
                    description: Inputs the job was created with
                  outputs:
                    type: object
                    properties:
                      video_url:
                        type: string
                        format: uri
                  metadata:
                    type: string
                    nullable: true
                    description: Arbitrary metadata string round-tripped from the create request
                  self:
                    type: string
                    format: uri
                  created_at:
                    type: string
                    format: date-time
                  completed_at:
                    type: string
                    format: date-time
                    nullable: true
                  error_message:
                    type: string
                    nullable: true
                    description: Human-readable failure reason (only present on failed jobs)
        '402':
          description: API quota exhausted — upgrade required
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: Human-readable explanation of the error
        '404':
          description: Unknown tool
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: Human-readable explanation of the error
        '422':
          description: Input validation failure
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: Human-readable explanation of the error
      tags:
      - Tools
      operationId: postToolsGenerateAiVideo
      x-operation-id-source: derived
  /tools/video_thumbnails:
    post:
      summary: Video thumbnails
      description: Grab still frames from a video at regular intervals. Async — returns 202 with a pending job; poll GET /tool_jobs/{uid} until `status` is `completed` or `failed`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                video_url:
                  description: Video URL
                  type: string
                  format: uri
                count:
                  description: How many frames to grab, up to 10
                  type: integer
                  default: 3
                interval:
                  description: Seconds between frames — fractions are fine, 0.5 for two a second
                  type: number
                  default: 1
                start:
                  description: Where the first frame is taken
                  type: number
                  default: 0
                metadata:
                  type: string
                  description: Arbitrary metadata string stored with the tool run
              required:
              - video_url
      responses:
        '202':
          description: Tool run accepted
          content:
            application/json:
              schema:
