openapi: 3.2.0
info:
  title: Bannerbear V5 Animation Templates API
  version: '5.0'
servers:
- url: https://api.bannerbear.com/v5
  description: Async render host. All endpoints.
- url: https://sync.api.bannerbear.com/v5
  description: Synchronous render host. Only accepts POST /images — returns the finished image inline instead of a pending record. Long-running requests may return 408.
security:
- bearerAuth: []
tags:
- name: Animation Templates
paths:
  /animation_templates:
    get:
      summary: List animation templates
      parameters:
      - name: page
        in: query
        schema:
          type: integer
        required: false
      responses:
        '200':
          description: Paginated list of templates
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    uid:
                      type: string
                    name:
                      type: string
                    description:
                      type: string
                      nullable: true
                    tags:
                      type: array
                      items:
                        type: string
                    width:
                      type: integer
                    height:
                      type: integer
                    frame_rate:
                      type: integer
                      enum:
                      - 24
                      - 30
                      - 60
                    duration_seconds:
                      type: number
                      description: Derived from the template's keyframes — not settable. 0 until something is animated.
                    preview:
                      type: string
                      nullable: true
                      format: uri
                      description: Preview image URL
                    ui_write_access:
                      type: string
                      enum:
                      - owner_only
                      - team
                      description: Who can edit in the dashboard — `owner_only` (default) or `team`
                    api_write_access:
                      type: string
                      enum:
                      - team
                      - owner_only
                      - nobody
                      description: Who can update or delete via the API — `team` (default), `owner_only`, or `nobody` (locked; unlock via dashboard)
                    config:
                      type: object
                      description: Canvas configuration. `objects` are the layers; `keyframes` drives the animation and determines duration.
                      properties:
                        objects:
                          type: array
                          items:
                            $ref: '#/components/schemas/Layer'
                        keyframes:
                          $ref: '#/components/schemas/Keyframes'
                    created_at:
                      type: string
                      format: date-time
      tags:
      - Animation Templates
      operationId: getAnimationTemplates
      x-operation-id-source: derived
    post:
      summary: Create an animation template
      description: Create an animation template. Send `config` to author layers and keyframes directly — see the Keyframes schema for the frame shape — or omit it and build the template in the dashboard editor. `duration_seconds` is derived from the keyframes rather than set.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              properties:
                name:
                  type: string
                description:
                  type: string
                  nullable: true
                tags:
                  type: array
                  items:
                    type: string
                width:
                  type: integer
                  minimum: 100
                  maximum: 5000
                height:
                  type: integer
                  minimum: 100
                  maximum: 5000
                frame_rate:
                  type: integer
                  enum:
                  - 24
                  - 30
                  - 60
                config:
                  type: object
                  description: Canvas configuration, replaced wholesale. `objects` are the layers; `keyframes` drives the animation and determines duration. Omit to leave the existing config untouched.
                  properties:
                    objects:
                      type: array
                      items:
                        $ref: '#/components/schemas/Layer'
                    keyframes:
                      $ref: '#/components/schemas/Keyframes'
      responses:
        '201':
          description: Template created
          content:
            application/json:
              schema:
                type: object
                properties:
                  uid:
                    type: string
                  name:
                    type: string
                  description:
                    type: string
                    nullable: true
                  tags:
                    type: array
                    items:
                      type: string
                  width:
                    type: integer
                  height:
                    type: integer
                  frame_rate:
                    type: integer
                    enum:
                    - 24
                    - 30
                    - 60
                  duration_seconds:
                    type: number
                    description: Derived from the template's keyframes — not settable. 0 until something is animated.
                  preview:
                    type: string
                    nullable: true
                    format: uri
                    description: Preview image URL
                  ui_write_access:
                    type: string
                    enum:
                    - owner_only
                    - team
                    description: Who can edit in the dashboard — `owner_only` (default) or `team`
                  api_write_access:
                    type: string
                    enum:
                    - team
                    - owner_only
                    - nobody
                    description: Who can update or delete via the API — `team` (default), `owner_only`, or `nobody` (locked; unlock via dashboard)
                  config:
                    type: object
                    description: Canvas configuration. `objects` are the layers; `keyframes` drives the animation and determines duration.
                    properties:
                      objects:
                        type: array
                        items:
                          $ref: '#/components/schemas/Layer'
                      keyframes:
                        $ref: '#/components/schemas/Keyframes'
                  created_at:
                    type: string
                    format: date-time
        '422':
          description: Validation failure
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: Human-readable explanation of the error
      tags:
      - Animation Templates
      operationId: postAnimationTemplates
      x-operation-id-source: derived
  /animation_templates/{uid}:
    get:
      summary: Get an animation template
      parameters:
      - name: uid
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Template details
          content:
            application/json:
              schema:
                type: object
                properties:
                  uid:
                    type: string
                  name:
                    type: string
                  description:
                    type: string
                    nullable: true
                  tags:
                    type: array
                    items:
                      type: string
                  width:
                    type: integer
                  height:
                    type: integer
                  frame_rate:
                    type: integer
                    enum:
                    - 24
                    - 30
                    - 60
                  duration_seconds:
                    type: number
                    description: Derived from the template's keyframes — not settable. 0 until something is animated.
                  preview:
                    type: string
                    nullable: true
                    format: uri
                    description: Preview image URL
                  ui_write_access:
                    type: string
                    enum:
                    - owner_only
                    - team
                    description: Who can edit in the dashboard — `owner_only` (default) or `team`
                  api_write_access:
                    type: string
                    enum:
                    - team
                    - owner_only
                    - nobody
                    description: Who can update or delete via the API — `team` (default), `owner_only`, or `nobody` (locked; unlock via dashboard)
                  config:
                    type: object
                    description: Canvas configuration. `objects` are the layers; `keyframes` drives the animation and determines duration.
                    properties:
                      objects:
                        type: array
                        items:
                          $ref: '#/components/schemas/Layer'
                      keyframes:
                        $ref: '#/components/schemas/Keyframes'
                  created_at:
                    type: string
                    format: date-time
        '404':
          description: Template not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: Human-readable explanation of the error
      tags:
      - Animation Templates
      operationId: getAnimationTemplatesByUid
      x-operation-id-source: derived
    patch:
      summary: Update an animation template
      description: Update metadata, or replace the whole canvas by sending `config`. Layers and keyframes both live in `config`, so a partial config replaces everything in it — read the template first and send back the full object with your changes applied.
      parameters:
      - name: uid
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                  nullable: true
                tags:
                  type: array
                  items:
                    type: string
                width:
                  type: integer
                  minimum: 100
                  maximum: 5000
                height:
                  type: integer
                  minimum: 100
                  maximum: 5000
                frame_rate:
                  type: integer
                  enum:
                  - 24
                  - 30
                  - 60
                config:
                  type: object
                  description: Canvas configuration, replaced wholesale. `objects` are the layers; `keyframes` drives the animation and determines duration. Omit to leave the existing config untouched.
                  properties:
                    objects:
                      type: array
                      items:
                        $ref: '#/components/schemas/Layer'
                    keyframes:
                      $ref: '#/components/schemas/Keyframes'
      responses:
        '200':
          description: Updated template
          content:
            application/json:
              schema:
                type: object
                properties:
                  uid:
                    type: string
                  name:
                    type: string
                  description:
                    type: string
                    nullable: true
                  tags:
                    type: array
                    items:
                      type: string
                  width:
                    type: integer
                  height:
                    type: integer
                  frame_rate:
                    type: integer
                    enum:
                    - 24
                    - 30
                    - 60
                  duration_seconds:
                    type: number
                    description: Derived from the template's keyframes — not settable. 0 until something is animated.
                  preview:
                    type: string
                    nullable: true
                    format: uri
                    description: Preview image URL
                  ui_write_access:
                    type: string
                    enum:
                    - owner_only
                    - team
                    description: Who can edit in the dashboard — `owner_only` (default) or `team`
                  api_write_access:
                    type: string
                    enum:
                    - team
                    - owner_only
                    - nobody
                    description: Who can update or delete via the API — `team` (default), `owner_only`, or `nobody` (locked; unlock via dashboard)
                  config:
                    type: object
                    description: Canvas configuration. `objects` are the layers; `keyframes` drives the animation and determines duration.
                    properties:
                      objects:
                        type: array
                        items:
                          $ref: '#/components/schemas/Layer'
                      keyframes:
                        $ref: '#/components/schemas/Keyframes'
                  created_at:
                    type: string
                    format: date-time
        '403':
          description: Template's api_write_access is `owner_only` and the caller's key is not owned by its creator
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: Human-readable explanation of the error
        '404':
          description: Template not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: Human-readable explanation of the error
        '422':
          description: Validation failure
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: Human-readable explanation of the error
        '423':
          description: Template's api_write_access is `nobody` — unlock via the dashboard
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: Human-readable explanation of the error
      tags:
      - Animation Templates
      operationId: patchAnimationTemplatesByUid
      x-operation-id-source: derived
    delete:
      summary: Delete an animation template
      description: Soft-deletes the template. Animations already rendered from it stay intact, but the template no longer appears in list/get calls and can't be used for new renders.
      parameters:
      - name: uid
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Template deleted
        '403':
          description: Template's api_write_access is `owner_only` and the caller's key is not owned by its creator
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: Human-readable explanation of the error
        '404':
          description: Template not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: Human-readable explanation of the error
        '423':
          description: Template's api_write_access is `nobody` — unlock via the dashboard
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: Human-readable explanation of the error
      tags:
      - Animation Templates
      operationId: deleteAnimationTemplatesByUid
      x-operation-id-source: derived
  /animation_templates/{uid}/animate:
    post:
      summary: Animate a template with a preset
      description: 'Applies a named preset to layers, optionally staggered. Deterministic and free: no model call, no AI credits, and the same request always produces the same keyframes — three layers at `stagger: 500` begin at 0, 500 and 1000ms exactly. Use this whenever the request already says what it wants. The template is versioned before it is overwritten.'
      parameters:
      - name: uid
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - preset
              properties:
                preset:
                  type: string
                  enum:
                  - FadeIn
                  - FadeOut
                  - ZoomIn
                  - ZoomOut
                  - GetBigger
                  - GetSmaller
                  - ScaleIn
                  - ScaleOut
                  - PopIn
                  - PopOut
                  description: FadeIn, FadeOut, ZoomIn, ZoomOut, GetBigger, GetSmaller, ScaleIn, ScaleOut work on any layer. PopIn and PopOut are measured in `em` and apply to text layers only.
                objects:
                  type: array
                  items:
                    type: string
                  description: Layer ids, in the order the stagger should run. Omit to animate every layer in stacking order.
                duration:
                  type: integer
                  default: 400
                  description: How long each layer's tween runs, in milliseconds
                stagger:
                  type: integer
                  default: 0
                  description: Milliseconds between each layer's START. At 500, layers begin at 0, 500, 1000 — not 500ms of gap after each finishes.
                easing:
                  type: string
                  description: Optional anime.js easing, e.g. easeOutCubic
                merge:
                  type: boolean
                  default: false
                  description: Keep keyframes on layers this call does not touch. False replaces the whole timeline.
      responses:
        '200':
          description: Template with its new keyframes
          content:
            application/json:
              schema:
                type: object
                properties:
                  uid:
                    type: string
                  name:
                    type: string
                  description:
                    type: string
                    nullable: true
                  tags:
                    type: array
                    items:
                      type: string
                  width:
                    type: integer
                  height:
                    type: integer
                  frame_rate:
                    type: integer
                    enum:
                    - 24
                    - 30
                    - 60
                  duration_seconds:
                    type: number
                    description: Derived from the template's keyframes — not settable. 0 until something is animated.
                  preview:
                    type: string
                    nullable: true
                    format: uri
                    description: Preview image URL
                  ui_write_access:
                    type: string
                    enum:
                    - owner_only
                    - team
                    description: Who can edit in the dashboard — `owner_only` (default) or `team`
                  api_write_access:
                    type: string
                    enum:
                    - team
                    - owner_only
                    - nobody
                    description: Who can update or delete via the API — `team` (default), `owner_only`, or `nobody` (locked; unlock via dashboard)
                  config:
                    type: object
                    description: Canvas configuration. `objects` are the layers; `keyframes` drives the animation and determines duration.
                    properties:
                      objects:
                        type: array
                        items:
                          $ref: '#/components/schemas/Layer'
                      keyframes:
                        $ref: '#/components/schemas/Keyframes'
                  created_at:
                    type: string
                    format: date-time
        '403':
          description: Template's api_write_access is `owner_only` and the caller's key is not owned by its creator
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: Human-readable explanation of the error
        '404':
          description: Template not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: Human-readable explanation of the error
        '422':
          description: Unknown preset, unknown layer id, or a text-only preset aimed at a non-text layer
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: Human-readable explanation of the error
        '423':
          description: Template's api_write_access is `nobody` — unlock via the dashboard
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: Human-readable explanation of the error
      tags:
      - Animation Templates
      operationId: postAnimationTemplatesByUidAnimate
      x-operation-id-source: derived
components:
  schemas:
    LayerCircle:
      type: object
      description: A `circle` layer.
      required:
      - id
      - type
      properties:
        id:
          type: string
          description: Unique layer id within the config
        type:
          type: string
          enum:
          - circle
          description: Layer type discriminator
        name:
          type: string
          description: Optional human-readable layer name
        anchor-gap-x:
          description: Horizontal offset from the anchor point in pixels
          type: number
        anchor-gap-y:
          description: Vertical offset from the anchor point in pixels
          type: number
        anchor-point:
          description: Which point on the target layer to anchor to
          type: string
          enum:
          - top-left
          - top-center
          - top-right
          - center-left
          - center
          - center-right
          - bottom-left
          - bottom-center
          - bottom-right
        anchor-to:
          description: Name of another layer to anchor this layer's position to
          type: string
        anchor-type:
          description: Whether to anchor to the container bounds or text bounds
          type: string
          enum:
          - container
          - text
        aspect-ratio-locked:
          description: aspect-ratio-locked
          type: boolean
        background-color:
          description: Background color of the container
          type: string
        background-color-gradient:
          description: Second color for a two-color gradient fill
          type: string
        background-gradient:
          description: 'Full CSS gradient for the fill, e.g. linear-gradient(135deg, #f00 0%, #00f 60%, transparent 100%) — any number of stops at any angle, and radial-gradient or conic-gradient are accepted. Takes priority over background-color-gradient and is drawn on top of background-color'
          type: string
        background-gradient-direction:
          description: Direction of the gradient fill
          type: string
          enum:
          - left
          - right
          - top
          - bottom
        blur:
          description: Gaussian blur radius in pixels
          type: number
        border-color:
          description: border-color
          type: string
        border-radius:
          description: Border radius in pixels for rounded corners
          type: number
        border-style:
          description: border-style
          type: string
          enum:
          - none
          - solid
        border-width:
          description: border-width
          type: number
        box-shadow:
          description: box-shadow
          type: string
        clip-mode:
          description: How clip-to hides this layer. outline cuts it to the target's shape. alpha also fades it by the transparency of the target's fill — its background-gradient, or else its background-color — so a gradient running to transparent fades this layer out. Hide the target layer to use it as a mask only
          type: string
          enum:
          - outline
          - alpha
        clip-to:
          description: 'Id or name of another layer to clip this layer to — only the part inside that layer''s box is drawn, following its border-radius and rotation. Clips chain: a layer clipped to a layer that is itself clipped shows only inside both'
          type: string
        height:
          description: height
          type: number
        hidden:
          description: Hide or show this layer
          type: boolean
        left:
          description: left
          type: number
        opacity:
          description: Opacity from 0 (transparent) to 1 (opaque)
          type: number
        padding:
          description: padding
          type: number
        perspective:
          description: Perspective distance for 3D transforms in pixels
          type: number
        responsive-anchor-gap:
          description: How the anchor gap adjusts when the template is resized
          type: string
          enum:
          - none
          - scale
          - scale-x
          - scale-y
          - stretch
          - stretch-x
          - stretch-y
        responsive-aspect-ratio:
          description: responsive-aspect-ratio
          type: string
          enum:
          - free
          - locked
        responsive-position:
          description: How the layer repositions when the template is resized
          type: string
          enum:
          - none
          - scale
          - center-x
          - center-y
          - center
          - pin-right
          - pin-bottom
          - pin-right-bottom
          - center-x-pin-bottom
          - center-y-pin-right
        responsive-size:
          description: How the layer resizes when the template is resized
          type: string
          enum:
          - none
          - scale
          - stretch-x
          - stretch-y
          - stretch
        rotate:
          description: Rotation angle in degrees
          type: number
        rotateX:
          description: 3D rotation around the X axis in degrees
          type: number
        rotateY:
          description: 3D rotation around the Y axis in degrees
          type: number
        rotateZ:
          description: 3D rotation around the Z axis in degrees
          type: number
        top:
          description: top
          type: number
        width:
          description: width
          type: number
    LayerText:
      type: object
      description: A `text` layer.
      required:
      - id
      - type
      properties:
        id:
          type: string
          description: Unique layer id within the config
        type:
          type: string
          enum:
          - text
          description: Layer type discriminator
        name:
          type: string
          description: Optional human-readable layer name
        align-items:
          description: Vertical text alignment within the container
          type: string
          enum:
          - start
          - center
          - end
        anchor-gap-x:
          description: Horizontal offset from the anchor point in pixels
          type: number
        anchor-gap-y:
          description: Vertical offset from the anchor point in pixels
          type: number
        anchor-point:
          description: Which point on the target layer to anchor to
          type: string
          enum:
          - top-left
          - top-center
          - top-right
          - center-left
          - center
          - center-right
          - bottom-left
          - bottom-center
          - bottom-right
        anchor-to:
          description: Name of another layer to anchor this layer's position to
          type: string
        anchor-type:
          description: Whether to anchor to the container bounds or text bounds
          type: string
          enum:
          - container
          - text
        background-color:
          description: background-color
          type: string
        blur:
          description: Gaussian blur radius in pixels
          type: number
        border-color:
          description: border-color
          type: string
        border-radius:
          description: Border radius in pixels for rounded corners
          type: number
        border-style:
          description: border-style
          type: string
          enum:
          - none
          - solid
        border-width:
          description: border-width
          type: number
        box-shadow:
          description: box-shadow
          type: string
        clip-mode:
          description: How clip-to hides this layer. outline cuts it to the target's shape. alpha also fades it by the transparency of the target's fill — its background-gradient, or else its background-color — so a gradient running to transparent fades this layer out. Hide the target layer to use it as a mask only
          type: string
          enum:
          - outline
          - alpha
        clip-to:
          description: 'Id or name of another layer to clip this layer to — only the part inside that layer''s box is drawn, following its border-radius and rotation. Clips chain: a layer clipped to a layer that is itself clipped shows only inside both'
          type: string
        color:
          description: color
          type: string
        color-secondary:
          description: Text color for text wrapped in *asterisks*
          type: string
        direction:
          description: direction
          type: string
          enum:
          - ltr
          - rtl
        font-family:
          description: Font family name (Google Fonts or custom font)
          type: string
        font-family-secondary:
          description: Font family for text wrapped in *asterisks*
          type: string
        font-size:
          description: font-size
          type: number
        font-style:
          description: font-style
          type: string
          enum:
          - normal
          - italic
        font-style-secondary:
          description: Font style for text wrapped in *asterisks*
          type: string
          nullable: true
          enum:
          - normal
          - italic
        font-weight:
          description: font-weight
          type: number
          enum:
          - 100
          - 200
          - 300
          - 400
          - 500
          - 600
          - 700
          - 800
          - 900
        font-weight-secondary:
          description: Font weight for text wrapped in *asterisks*
          type: number
          nullable: true
          enum:
          - 100
          - 200
          - 300
          - 400
          - 500
          - 600
          - 700
          - 800
          - 900
        height:
          description: height
          type: number
        hidden:
          description: Hide or show this layer
          type: boolean
        left:
          description: left
          type: number
        letter-spacing:
          description: letter-spacing
          type: number
        line-height:
          description: Line height multiplier for text spacing
          type: number
        opacity:
          description: Opacity from 0 (transparent) to 1 (opaque)
          type: number
        padding:
          description: padding
          type: number
        perspective:
          description: Perspective distance for 3D transforms in pixels
          type: number
        responsive-anchor-gap:
          description: How the anchor gap adjusts when the template is resized
          type: string
          enum:
          - none
          - scale
          - scale-x
          - scale-y
          - stretch
          - stretch-x
          - stretch-y
        responsive-aspect-ratio:
          description: Whether the layer keeps its aspect ratio when responsively resized
          type: string
          enum:
          - free
          - locked
        responsive-position:
          description: How the layer repositions when the template is resized
          type: string
          enum:
          - none
          - scale
