openapi: 3.2.0
info:
  title: Bannerbear V5 Images API
  version: '5.0'
servers:
- url: https://api.bannerbear.com/v5
  description: Async render host. All endpoints.
- url: https://sync.api.bannerbear.com/v5
  description: Synchronous render host. Only accepts POST /images — returns the finished image inline instead of a pending record. Long-running requests may return 408.
security:
- bearerAuth: []
tags:
- name: Images
paths:
  /images:
    get:
      summary: List images
      parameters:
      - name: page
        in: query
        schema:
          type: integer
        required: false
      responses:
        '200':
          description: Paginated list of images
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    uid:
                      type: string
                    status:
                      type: string
                      enum:
                      - pending
                      - completed
                      - failed
                    template:
                      type: string
                    files:
                      type: object
                      description: Output file URLs keyed by format
                    metadata:
                      type: string
                      nullable: true
                    error:
                      type: string
                      nullable: true
                      description: Error message (only present on failure)
                    self:
                      type: string
                      format: uri
                    created_at:
                      type: string
                      format: date-time
                    completed_at:
                      type: string
                      format: date-time
                      nullable: true
      tags:
      - Images
      operationId: getImages
      x-operation-id-source: derived
    post:
      summary: Create an image
      description: Create an image render. Async on api.bannerbear.com (returns 202 + pending record, poll via GET /images/{uid} or subscribe via webhook). Sync on sync.api.bannerbear.com (returns 200 + completed image inline, or 408 if the render exceeds the sync timeout).
      servers:
      - url: https://api.bannerbear.com/v5
        description: Async — returns 202
      - url: https://sync.api.bannerbear.com/v5
        description: Sync — returns 200 or 408
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImageCreateRequest'
      responses:
        '200':
          description: Sync render complete (sync host only)
          content:
            application/json:
              schema:
                type: object
                properties:
                  uid:
                    type: string
                  status:
                    type: string
                    enum:
                    - pending
                    - completed
                    - failed
                  template:
                    type: string
                  files:
                    type: object
                    description: Output file URLs keyed by format
                  metadata:
                    type: string
                    nullable: true
                  error:
                    type: string
                    nullable: true
                    description: Error message (only present on failure)
                  self:
                    type: string
                    format: uri
                  created_at:
                    type: string
                    format: date-time
                  completed_at:
                    type: string
                    format: date-time
                    nullable: true
        '202':
          description: Async render accepted (async host only)
          content:
            application/json:
              schema:
                type: object
                properties:
                  uid:
                    type: string
                  status:
                    type: string
                    enum:
                    - pending
                    - completed
                    - failed
                  template:
                    type: string
                  files:
                    type: object
                    description: Output file URLs keyed by format
                  metadata:
                    type: string
                    nullable: true
                  error:
                    type: string
                    nullable: true
                    description: Error message (only present on failure)
                  self:
                    type: string
                    format: uri
                  created_at:
                    type: string
                    format: date-time
                  completed_at:
                    type: string
                    format: date-time
                    nullable: true
        '402':
          description: API quota exhausted — upgrade required
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: Human-readable explanation of the error
        '403':
          description: API key does not have access to this template
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: Human-readable explanation of the error
        '404':
          description: Template not found in this workspace
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: Human-readable explanation of the error
        '408':
          description: Sync render timed out (sync host only)
        '422':
          description: Payload validation failure — e.g. invalid modification, unknown attribute, bad option value
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: Human-readable explanation of the error
      tags:
      - Images
      operationId: postImages
      x-operation-id-source: derived
  /images/{uid}:
    get:
      summary: Get an image
      parameters:
      - name: uid
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Image details
          content:
            application/json:
              schema:
                type: object
                properties:
                  uid:
                    type: string
                  status:
                    type: string
                    enum:
                    - pending
                    - completed
                    - failed
                  template:
                    type: string
                  files:
                    type: object
                    description: Output file URLs keyed by format
                  metadata:
                    type: string
                    nullable: true
                  error:
                    type: string
                    nullable: true
                    description: Error message (only present on failure)
                  self:
                    type: string
                    format: uri
                  created_at:
                    type: string
                    format: date-time
                  completed_at:
                    type: string
                    format: date-time
                    nullable: true
      tags:
      - Images
      operationId: getImagesByUid
      x-operation-id-source: derived
components:
  schemas:
    ImageCreateRequest:
      type: object
      required:
      - template
      - modifications
      properties:
        template:
          type: string
          description: Template UID
        modifications:
          type: object
          description: Template and object modifications
          properties:
            template:
              type: object
              description: Template-level overrides
              properties:
                width:
                  type: integer
                  description: Override template width in pixels
                height:
                  type: integer
                  description: Override template height in pixels
                transparent:
                  type: boolean
                  description: Render with transparent background
            objects:
              type: array
              description: Array of object modifications
              items:
                type: object
                properties:
                  name:
                    type: string
                    description: Layer name to target (use name or id, not both)
                  id:
                    type: string
                    description: Layer ID to target (use name or id, not both)
                  left:
                    description: X position in pixels
                    type: number
                  top:
                    description: Y position in pixels
                    type: number
                  width:
                    description: Width in pixels
                    type: number
                  height:
                    description: Height in pixels
                    type: number
                  rotate:
                    description: Rotation angle in degrees
                    type: number
                  rotateX:
                    description: 3D rotation around the X axis in degrees
                    type: number
                  rotateY:
                    description: 3D rotation around the Y axis in degrees
                    type: number
                  rotateZ:
                    description: 3D rotation around the Z axis in degrees
                    type: number
                  perspective:
                    description: Perspective distance for 3D transforms in pixels
                    type: number
                  blur:
                    description: Gaussian blur radius in pixels
                    type: number
                  opacity:
                    description: Opacity from 0 (transparent) to 1 (opaque)
                    type: number
                  hidden:
                    description: Hide or show this layer
                    type: boolean
                  padding:
                    description: Inner padding in pixels
                    type: number
                  background-color:
                    description: Background color of the container
                    type: string
                  box-shadow:
                    description: 'Box shadow in CSS format e.g. 2px 2px 4px #000'
                    type: string
                  border-style:
                    description: 'Border style: none or solid'
                    type: string
                    enum:
                    - none
                    - solid
                  border-color:
                    description: Border color as hex, rgb, or named color
                    type: string
                  border-width:
                    description: Border width in pixels
                    type: number
                  clip-mode:
                    description: How clip-to hides this layer. outline cuts it to the target's shape. alpha also fades it by the transparency of the target's fill — its background-gradient, or else its background-color — so a gradient running to transparent fades this layer out. Hide the target layer to use it as a mask only
                    type: string
                    enum:
                    - outline
                    - alpha
                  anchor-point:
                    description: Which point on the target layer to anchor to
                    type: string
                    enum:
                    - top-left
                    - top-center
                    - top-right
                    - center-left
                    - center
                    - center-right
                    - bottom-left
                    - bottom-center
                    - bottom-right
                  anchor-type:
                    description: Whether to anchor to the container bounds or text bounds
                    type: string
                    enum:
                    - container
                    - text
                  anchor-gap-x:
                    description: Horizontal offset from the anchor point in pixels
                    type: number
                  anchor-gap-y:
                    description: Vertical offset from the anchor point in pixels
                    type: number
                  responsive-position:
                    description: How the layer repositions when the template is resized
                    type: string
                    enum:
                    - none
                    - scale
                    - center-x
                    - center-y
                    - center
                    - pin-right
                    - pin-bottom
                    - pin-right-bottom
                    - center-x-pin-bottom
                    - center-y-pin-right
                  responsive-size:
                    description: How the layer resizes when the template is resized
                    type: string
                    enum:
                    - none
                    - scale
                    - stretch-x
                    - stretch-y
                    - stretch
                  responsive-aspect-ratio:
                    description: Whether the layer keeps its aspect ratio when responsively resized
                    type: string
                    enum:
                    - free
                    - locked
                  responsive-anchor-gap:
                    description: How the anchor gap adjusts when the template is resized
                    type: string
                    enum:
                    - none
                    - scale
                    - scale-x
                    - scale-y
                    - stretch
                    - stretch-x
                    - stretch-y
                  text:
                    description: Text content to display
                    type: string
                  color:
                    description: Text or fill color as hex, rgb, or named color
                    type: string
                  text-highlight-color:
                    description: Background color behind individual lines of text
                    type: string
                  text-highlight-padding-vertical:
                    description: Vertical padding around text highlight in pixels
                    type: number
                  text-highlight-padding-horizontal:
                    description: Horizontal padding around text highlight in pixels
                    type: number
                  text-highlight-border-radius:
                    description: Corner radius of the text highlight in pixels
                    type: number
                  text-highlight-shadow:
                    description: 'CSS box-shadow applied to the text highlight, e.g. 0px 2px 4px #000'
                    type: string
                  text-background-image-mask:
                    description: Image URL to use as a clipping mask for the text fill
                    type: string
                  font-size:
                    description: Font size in pixels
                    type: number
                  font-weight:
                    description: Font weight from 100 (thin) to 900 (black)
                    type: number
                    enum:
                    - 100
                    - 200
                    - 300
                    - 400
                    - 500
                    - 600
                    - 700
                    - 800
                    - 900
                  font-style:
                    description: 'Font style: normal or italic'
                    type: string
                    enum:
                    - normal
                    - italic
                  line-height:
                    description: Line height multiplier for text spacing
                    type: number
                  text-decoration:
                    description: 'Text decoration: none, underline, or overline'
                    type: string
                    enum:
                    - none
                    - underline
                    - overline
                  text-transform:
                    description: 'Text capitalization: none, uppercase, lowercase, or capitalize'
                    type: string
                    enum:
                    - none
                    - uppercase
                    - lowercase
                    - capitalize
                  text-align:
                    description: Horizontal text alignment
                    type: string
                    enum:
                    - left
                    - center
                    - right
                    - justify
                    - start
                    - end
                  align-items:
                    description: Vertical text alignment within the container
                    type: string
                    enum:
                    - start
                    - center
                    - end
                  direction:
                    description: 'Text direction: ltr (left-to-right) or rtl (right-to-left)'
                    type: string
                    enum:
                    - ltr
                    - rtl
                  word-break:
                    description: Word breaking behavior for long words
                    type: string
                    enum:
                    - normal
                    - break-all
                    - keep-all
                    - break-word
                  white-space:
                    description: How whitespace and line breaks are handled
                    type: string
                    enum:
                    - normal
                    - nowrap
                    - pre
                    - pre-wrap
                    - pre-line
                  letter-spacing:
                    description: Letter spacing in pixels
                    type: number
                  skewX:
                    description: Horizontal skew angle in degrees
                    type: number
                  skewY:
                    description: Vertical skew angle in degrees
                    type: number
                  text-shadow:
                    description: 'Text shadow in CSS format e.g. 2px 2px 4px #000'
                    type: string
                  text-stroke-width:
                    description: Width of the text outline stroke in pixels
                    type: number
                  text-stroke-color:
                    description: Color of the text outline stroke
                    type: string
                  font-family-secondary:
                    description: Font family for text wrapped in *asterisks*
                    type: string
                  color-secondary:
                    description: Text color for text wrapped in *asterisks*
                    type: string
                  font-weight-secondary:
                    description: Font weight for text wrapped in *asterisks*
                    type: number
                    nullable: true
                    enum:
                    - 100
                    - 200
                    - 300
                    - 400
                    - 500
                    - 600
                    - 700
                    - 800
                    - 900
                  font-style-secondary:
                    description: Font style for text wrapped in *asterisks*
                    type: string
                    nullable: true
                    enum:
                    - normal
                    - italic
                  text-transform-secondary:
                    description: Text transform for text wrapped in *asterisks*
                    type: string
                    nullable: true
                    enum:
                    - none
                    - uppercase
                    - lowercase
                    - capitalize
                  text-decoration-secondary:
                    description: Text decoration for text wrapped in *asterisks*
                    type: string
                    nullable: true
                    enum:
                    - none
                    - underline
                    - line-through
                  text-fit:
                    description: How text is sized to fit its container
                    type: string
                    enum:
                    - 'off'
                    - auto_fit
                    - resize_overflow
                  text-ellipsis:
                    description: Truncate overflowing text with an ellipsis
                    type: boolean
                  background-color-gradient:
                    description: Second color for a two-color gradient fill
                    type: string
                  background-gradient-direction:
                    description: Direction of the gradient fill
                    type: string
                    enum:
                    - left
                    - right
                    - top
                    - bottom
                  background-gradient:
                    description: 'Full CSS gradient for the fill, e.g. linear-gradient(135deg, #f00 0%, #00f 60%, transparent 100%) — any number of stops at any angle, and radial-gradient or conic-gradient are accepted. Takes priority over background-color-gradient and is drawn on top of background-color'
                    type: string
                  background-image:
                    description: Image URL to display in the container
                    type: string
                  background-size:
                    description: How the background image fills the container
                    type: string
                    enum:
                    - cover
                    - contain
                  background-position:
                    description: Anchor position for the background image within the container — most useful when background-size is contain
                    type: string
                    enum:
                    - center
                    - top
                    - right
                    - bottom
                    - left
                    - top left
                    - top right
                    - bottom left
                    - bottom right
                  background-crop:
                    description: 'Region of the source image to show, as four percentages of the image: left top width height, e.g. 10% 5% 60% 80%. The region is stretched to fill the layer, so give it the layer''s aspect ratio. Overrides background-size and background-position; send none to clear it. Ignored while ai-detect is on'
                    type: string
                  background-blend-mode:
                    description: Blend mode applied to the background image
                    type: string
                    enum:
                    - normal
                    - multiply
                    - screen
                    - overlay
                    - darken
                    - lighten
                    - color-dodge
                    - color-burn
                    - hard-light
                    - soft-light
                    - difference
                    - exclusion
                    - hue
                    - saturation
                    - color
                    - luminosity
                  grayscale:
                    description: Grayscale filter intensity from 0 to 1
                    type: number
                  sepia:
                    description: Sepia filter intensity from 0 to 1
                    type: number
                  brightness:
                    description: Brightness adjustment where 1 is normal
                    type: number
                  contrast:
                    description: Contrast adjustment where 1 is normal
                    type: number
                  saturate:
                    description: Saturation adjustment where 1 is normal
                    type: number
                  ai-detect:
                    description: AI detection mode for automatic image positioning
                    type: string
                    enum:
                    - 'off'
                    - face
                    - subject
                  ai-detect-focus:
                    description: Which detection to focus on when multiple are found
                    type: string
                    enum:
                    - first
                    - largest
                    - group
                  ai-detect-on-fail:
                    description: Fallback background-size when no face or subject is detected
                    type: string
                    enum:
                    - fallback_cover
                    - fallback_contain
                  ai-detect-zoom:
                    description: Zoom level for AI detection crop
                    type: string
                    enum:
                    - auto
                    - 50%
                    - 60%
                    - 70%
                    - 80%
                    - 90%
                  ai-detect-anchor:
                    description: Manual anchor point override for AI detection in x:y format (0-100)
                    type: string
                  ai-background-remove:
                    description: Whether to automatically remove the background of images submitted to this container via the API
                    type: string
                    enum:
                    - disabled
                    - enabled
                  ai-background-generate:
                    description: Whether the container should generate its background image via AI when an ai-prompt is supplied in the API request
                    type: string
                    enum:
                    - disabled
                    - enabled
                  ai-prompt:
                    description: Prompt for AI background generation — applies when the layer has ai-background-generate enabled
                    type: string
                  ai-model:
                    description: Which AI model generates this layer's background. Costs vary by model — Flux Schnell is a tenth the price of Flux 1.1 Pro. Can be overridden per request by sending ai-model alongside ai-prompt
                    type: string
                    enum:
                    - flux_schnell
                    - flux_1_1_pro
                    - nano_banana
                    - gpt_image_2
                  png-stroke-width:
                    description: Outline stroke width around PNG images in pixels
                    type: number
                  png-stroke-color:
                    description: Outline stroke color around PNG images
                    type: string
                  png-shadow:
                    description: Drop shadow for PNG images in CSS shadow format
                    type: string
                  aspect-ratio-locked:
                    description: aspect-ratio-locked
                    type: boolean
                  basic-shape:
                    description: The SVG shape to render
                    type: string
                    enum:
                    - triangle
                    - scalene
                    - pentagon
                    - right
                    - trapeze
                    - kite
                    - polygon
                    - parallelogram
                    - ellipse
                    - trefoil
                    - star
                    - semicircle
                    - hexagon
                    - crescent
                    - octagon
                    - cross
                    - ring
                    - heart
                    - arrow
                    - rhombus
                    - custom
                  svg-url:
                    description: URL of the SVG file to draw when basic-shape is custom. The file keeps its own colors unless fill, a gradient or a stroke is set
                    type: string
                  fill:
                    description: Fill color of the shape
                    type: string
                  stroke:
                    description: Stroke color of the shape outline
                    type: string
                  stroke-width:
                    description: Stroke width of the shape outline in pixels
                    type: number
                  qr-target:
                    description: URL or text content to encode in the QR code
                    type: string
                  qr-color:
                    description: Foreground color of the QR code
                    type: string
                  barcode-data:
                    description: Data to encode in the barcode
                    type: string
                  barcode-format:
                    description: Barcode encoding format
                    type: string
                    enum:
                    - CODE128
                    - EAN13
                    - UPC
                    - EAN8
                  barcode-color:
                    description: Foreground color of the barcode
                    type: string
                  rating-score:
                    description: Rating score from 0 to 100
                    type: number
                  rating-shape:
                    description: Shape used for each rating unit
                    type: string
                    enum:
                    - star
                    - cute_star
                    - heart
                    - circle
                    - diamond
                    - square
                    - hexagon
                  rating-count:
                    description: Number of shapes to display
                    type: number
                  rating-color:
                    description: Fill color for active rating shapes
                    type: string
                  rating-background-color:
                    description: Fill color for inactive rating shapes
                    type: string
                  rating-gap:
                    description: Gap between rating shapes in pixels
                    type: number
                  rating-stroke-color:
                    description: Outline stroke color for rating shapes
                    type: string
                  rating-stroke-width:
                    description: Outline stroke width for rating shapes in pixels
                    type: number
                  rating-shadow:
                    description: Drop shadow for rating shapes in CSS shadow format
                    type: string
                  lottie-url:
                    description: URL of the Lottie JSON file to play
                    type: string
                  lottie-delay:
                    description: Milliseconds to wait after the animation starts before this Lottie begins playing
                    type: number
                  lottie-loop:
                    description: Whether the Lottie repeats when it reaches its end, rather than holding its last frame
                    type: boolean
                  motion-preset:
                    description: Which moving background preset to draw
                    type: string
                    enum:
                    - aurora
                    - mesh
                    - conic
                    - pulse
                  motion-color:
                    description: Colour of the background — its hue drives the preset, so any colour of that hue gives the same result
                    type: string
                  motion-cycle:
                    description: Milliseconds for one full loop of the background motion
                    type: number
                  motion-hue:
                    description: Base hue of the background, 0-360
                    type: number
                  motion-spread:
                    description: How far the secondary colours sit from the base hue, in degrees
                    type: number
                  motion-blur:
                    description: Softness of the background in pixels
                    type: number
                  motion-travel:
                    description: How far the background moves, as a percentage of the layer
                    type: number
                  audio-url:
                    description: URL of the audio file the wave follows
                    type: string
                  wave-envelope:
                    description: Loudness samples the wave is drawn from, 25 per second from 0 to 1, comma-separated — set automatically when the audio URL is analysed
                    type: string
                  wave-bars:
                    description: Number of bars
                    type: number
                  wave-gap:
                    description: Gap between bars in pixels
                    type: number
                  wave-color:
                    description: Colour of the bars
                    type: string
                  wave-radius:
                    description: Corner radius of each bar in pixels
                    type: number
                  wave-mirror:
                    description: Grow the bars from the middle in both directions rather than up from the bottom
                    type: boolean
                  wave-min-height:
                    description: Height of a bar in silence, as a percentage of the layer
                    type: number
                  wave-sensitivity:
                    description: Scales how far the bars move — above 1 exaggerates quiet passages
                    type: number
                  wave-offset:
                    description: Milliseconds into the audio at which the animation starts
                    type: number
                  collapsed:
                    description: collapsed
                    type: boolean
                  font-family:
                    description: Font family name (Google Fonts or custom font)
                    type: string
                  border-radius:
                    description: Border radius in pixels for rounded corners
                    type: number
        formats:
          type: array
          description: Output file formats
          default:
          - jpg
          items:
            type: string
            enum:
            - jpg
            - png
            - pdf
            - webp
            - avif
        scale:
          type: integer
          description: Output scale multiplier for higher resolution
          default: 1
          enum:
          - 1
          - 2
          - 3
          - 4
        dpi:
          type: integer
          description: DPI metadata embedded in the output image for print sizing
          minimum: 72
          maximum: 600
        quality:
          type: integer
          description: Compression quality for JPG/WebP output
          minimum: 1
          maximum: 100
        proxy:
          type: boolean
          description: Proxy and resize external images before rendering
          default: false
        metadata:
          type: string
          description: Arbitrary metadata string stored with the image
        version:
          type: integer
          description: Target a specific template version number
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: API key (e.g. bb_ak_v5_...)
x-provenance:
  method: harvested
  publisher: Bannerbear
  source: https://api.bannerbear.com/v5/openapi.json
  note: split by refine-openapis from the provider's own published document, verified by fetch (openapi/_original/*.fetch.json);
    stamped by stamp-openapi-provenance.py (roadmap#793)
