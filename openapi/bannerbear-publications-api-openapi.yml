        anchor-to:
          description: Name of another layer to anchor this layer's position to
          type: string
        anchor-type:
          description: Whether to anchor to the container bounds or text bounds
          type: string
          enum:
          - container
          - text
        aspect-ratio-locked:
          description: aspect-ratio-locked
          type: boolean
        background-blend-mode:
          description: Blend mode applied to the image
          type: string
          enum:
