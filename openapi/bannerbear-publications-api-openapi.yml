openapi: 3.2.0
info:
  title: Bannerbear V5 Publications API
  version: '5.0'
servers:
- url: https://api.bannerbear.com/v5
  description: Async render host. All endpoints.
- url: https://sync.api.bannerbear.com/v5
  description: Synchronous render host. Only accepts POST /images — returns the finished image inline instead of a pending record. Long-running requests may return 408.
security:
- bearerAuth: []
tags:
- name: Publications
paths:
  /publications:
    get:
      summary: Browse the public library
      description: Returns publications with `visibility=public_library` from every team, which is the same set the dashboard's template library shows. Legacy V3 publications are included and their `uid` carries a `v3_` prefix; they install as V5 image templates, converted on the way in. Publications are user-owned resources that span workspaces, so there's no workspace-scoped listing — if you need your own publication UIDs, grab them from the dashboard at publish time and hit `/publications/{uid}` or `/publications/{uid}/install` directly.
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
      - name: kind
        in: query
        required: false
        schema:
          type: string
          enum:
          - image
          - animation
          - workflow
        description: Only publications of this kind. Omit for all of them.
      - name: category
        in: query
        required: false
        schema:
          type: string
          enum:
          - announcements & news
          - beauty & fashion
          - business & finance
          - education & coaching
          - employee highlights
          - events & weddings
          - film & movies
          - food & drinks
          - gaming & e-sports
          - home & real estate
          - marketing & sales
          - motivational quotes
          - podcasts & publishing
          - product showcase
          - reviews & testimonials
          - social media
          - tech & crypto
          - travel & nature
        description: Only publications in this category, matched against their tags. Comma-separate to match any of several.
      - name: q
        in: query
        required: false
        schema:
          type: string
        description: Only publications whose name contains this text, case-insensitive.
      responses:
        '200':
          description: Paginated list of public library publications
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    uid:
                      type: string
                      description: A `v3_` prefix marks a legacy V3 publication. Pass the uid back verbatim, prefix included.
                    name:
                      type: string
                    description:
                      type: string
                      nullable: true
                    tags:
                      type: array
                      items:
                        type: string
                    categories:
                      type: array
                      items:
                        type: string
                        enum:
                        - announcements & news
                        - beauty & fashion
                        - business & finance
                        - education & coaching
                        - employee highlights
                        - events & weddings
                        - film & movies
                        - food & drinks
                        - gaming & e-sports
                        - home & real estate
                        - marketing & sales
                        - motivational quotes
                        - podcasts & publishing
                        - product showcase
                        - reviews & testimonials
                        - social media
                        - tech & crypto
                        - travel & nature
                      description: Library categories this publication falls into, derived from its tags. These are the values the index endpoint's `category` filter takes.
                    visibility:
                      type: string
                      enum:
                      - unpublished
                      - published
                      - public_library
                      description: unpublished, published, or public_library
                    preview:
                      type: string
                      nullable: true
                      format: uri
                      description: Preview image or gif URL
                    install_count:
                      type: integer
                      description: Number of times this publication has been installed into a workspace
                    template_kind:
                      type: string
                      enum:
                      - image
                      - animation
                      - workflow
                      description: Which kind of template this publication creates when installed
                    width:
                      type: integer
                      nullable: true
                      description: Canvas width in pixels. Null for a workflow, which has no canvas of its own.
                    height:
                      type: integer
                      nullable: true
                      description: Canvas height in pixels. Null for a workflow, which has no canvas of its own.
                    published_at:
                      type: string
                      format: date-time
                      nullable: true
                    created_at:
                      type: string
                      format: date-time
      tags:
      - Publications
      operationId: getPublications
      x-operation-id-source: derived
  /publications/{uid}:
    get:
      summary: Get a publication
      description: Public library publications are visible to any authenticated caller, including legacy V3 ones, whose uid carries a `v3_` prefix — a bare V3 uid resolves too. Published publications are only returned to the user who created them.
      parameters:
      - name: uid
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Publication details
          content:
            application/json:
              schema:
                type: object
                properties:
                  uid:
                    type: string
                    description: A `v3_` prefix marks a legacy V3 publication. Pass the uid back verbatim, prefix included.
                  name:
                    type: string
                  description:
                    type: string
                    nullable: true
                  tags:
                    type: array
                    items:
                      type: string
                  categories:
                    type: array
                    items:
                      type: string
                      enum:
                      - announcements & news
                      - beauty & fashion
                      - business & finance
                      - education & coaching
                      - employee highlights
                      - events & weddings
                      - film & movies
                      - food & drinks
                      - gaming & e-sports
                      - home & real estate
                      - marketing & sales
                      - motivational quotes
                      - podcasts & publishing
                      - product showcase
                      - reviews & testimonials
                      - social media
                      - tech & crypto
                      - travel & nature
                    description: Library categories this publication falls into, derived from its tags. These are the values the index endpoint's `category` filter takes.
                  visibility:
                    type: string
                    enum:
                    - unpublished
                    - published
                    - public_library
                    description: unpublished, published, or public_library
                  preview:
                    type: string
                    nullable: true
                    format: uri
                    description: Preview image or gif URL
                  install_count:
                    type: integer
                    description: Number of times this publication has been installed into a workspace
                  template_kind:
                    type: string
                    enum:
                    - image
                    - animation
                    - workflow
                    description: Which kind of template this publication creates when installed
                  width:
                    type: integer
                    nullable: true
                    description: Canvas width in pixels. Null for a workflow, which has no canvas of its own.
                  height:
                    type: integer
                    nullable: true
                    description: Canvas height in pixels. Null for a workflow, which has no canvas of its own.
                  published_at:
                    type: string
                    format: date-time
                    nullable: true
                  created_at:
                    type: string
                    format: date-time
        '404':
          description: Publication not found or not accessible to this key
      tags:
      - Publications
      operationId: getPublicationsByUid
      x-operation-id-source: derived
  /publications/{uid}/install:
    post:
      summary: Install a publication into the workspace
      description: Clones the publication's snapshot into the API key's team. What it creates depends on the publication's `template_kind` — an image template, an animation template, or a workflow and the templates its steps use. A legacy V3 publication (uid prefixed `v3_`) is converted into a V5 image template on the way in. Returns the newly created resource. Trial accounts are capped at 3 templates per kind — installing beyond the cap returns 402.
      parameters:
      - name: uid
        in: path
        required: true
        schema:
          type: string
      responses:
        '201':
          description: Installed. The response shape matches the resource that was created, so it follows the publication's `template_kind`.
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  description: Image template. `config.objects` is the full canvas config — matches exactly the shape PATCH accepts, so responses round-trip cleanly.
                  properties:
                    uid:
                      type: string
                    name:
                      type: string
                    description:
                      type: string
                      nullable: true
                    tags:
                      type: array
                      items:
                        type: string
                    width:
                      type: integer
                    height:
                      type: integer
                    responsive:
                      type: boolean
                      description: True if the template has responsive sizing or positioning
                    preview:
                      type: string
                      nullable: true
                      format: uri
                      description: Preview image URL
                    ui_write_access:
                      type: string
                      enum:
                      - owner_only
                      - team
                      description: Who can edit this template in the dashboard — `owner_only` (default) or `team`
                    api_write_access:
                      type: string
                      enum:
                      - team
                      - owner_only
                      - nobody
                      description: Who can update or delete this template via the API — `team` (default, any workspace API key), `owner_only` (only API keys owned by the template's creator), or `nobody` (locked; unlock via dashboard)
                    config:
                      type: object
                      description: Full canvas configuration.
                      properties:
                        objects:
                          type: array
                          items:
                            $ref: '#/components/schemas/Layer'
                          description: Layers on the canvas
                    created_at:
                      type: string
                      format: date-time
                - type: object
                  properties:
                    uid:
                      type: string
                    name:
                      type: string
                    description:
                      type: string
                      nullable: true
                    tags:
                      type: array
                      items:
                        type: string
                    width:
                      type: integer
                    height:
                      type: integer
                    frame_rate:
                      type: integer
                      enum:
                      - 24
                      - 30
                      - 60
                    duration_seconds:
                      type: number
                      description: Derived from the template's keyframes — not settable. 0 until something is animated.
                    preview:
                      type: string
                      nullable: true
                      format: uri
                      description: Preview image URL
                    ui_write_access:
                      type: string
                      enum:
                      - owner_only
                      - team
                      description: Who can edit in the dashboard — `owner_only` (default) or `team`
                    api_write_access:
                      type: string
                      enum:
                      - team
                      - owner_only
                      - nobody
                      description: Who can update or delete via the API — `team` (default), `owner_only`, or `nobody` (locked; unlock via dashboard)
                    config:
                      type: object
                      description: Canvas configuration. `objects` are the layers; `keyframes` drives the animation and determines duration.
                      properties:
                        objects:
                          type: array
                          items:
                            $ref: '#/components/schemas/Layer'
                        keyframes:
                          $ref: '#/components/schemas/Keyframes'
                    created_at:
                      type: string
                      format: date-time
                - type: object
                  properties:
                    uid:
                      type: string
                    name:
                      type: string
                    description:
                      type: string
                      nullable: true
                    tags:
                      type: array
                      items:
                        type: string
                    inputs:
                      type: object
                      description: Inputs this workflow accepts, keyed by name. Each value is { type, required }. `url`-typed inputs are validated as http(s) URLs when a run is created.
                      additionalProperties:
                        type: object
                        properties:
                          type:
                            type: string
                            enum:
                            - string
                            - url
                            - number
                            - boolean
                          required:
                            type: boolean
                    steps:
                      type: array
                      items:
                        type: object
                        properties:
                          key:
                            type: string
                            description: Stable handle for this step; later steps reference it as {{steps.<key>.<output>}}
                          type:
                            type: string
                            enum:
                            - tool
                            - image
                            - animation
                            description: What kind of operation this step performs
                          ref:
                            type: string
                            description: Tool slug, or template UID for image / animation steps
                          label:
                            type: string
                            description: Human name of the step's target — the tool's label or the template's name
                          inputs:
                            type: object
                            description: Step payload, with {{inputs.x}} / {{steps.x.y}} references unresolved
                      description: Steps in run order
                    ui_write_access:
                      type: string
                      enum:
                      - owner_only
                      - team
                    api_write_access:
                      type: string
                      enum:
                      - team
                      - owner_only
                      - nobody
                      description: Who may run this workflow via the API
                    created_at:
                      type: string
                      format: date-time
        '402':
          description: Trial cap hit — upgrade required
        '403':
          description: Publication is unpublished and cannot be installed
        '404':
          description: Publication not found
      tags:
      - Publications
      operationId: postPublicationsByUidInstall
      x-operation-id-source: derived
components:
  schemas:
    LayerCircle:
      type: object
      description: A `circle` layer.
      required:
      - id
      - type
      properties:
        id:
          type: string
          description: Unique layer id within the config
        type:
          type: string
          enum:
          - circle
          description: Layer type discriminator
        name:
          type: string
          description: Optional human-readable layer name
        anchor-gap-x:
          description: Horizontal offset from the anchor point in pixels
          type: number
        anchor-gap-y:
          description: Vertical offset from the anchor point in pixels
          type: number
        anchor-point:
          description: Which point on the target layer to anchor to
          type: string
          enum:
          - top-left
          - top-center
          - top-right
          - center-left
          - center
          - center-right
          - bottom-left
          - bottom-center
          - bottom-right
        anchor-to:
          description: Name of another layer to anchor this layer's position to
          type: string
        anchor-type:
          description: Whether to anchor to the container bounds or text bounds
          type: string
          enum:
          - container
          - text
        aspect-ratio-locked:
          description: aspect-ratio-locked
          type: boolean
        background-color:
          description: Background color of the container
          type: string
        background-color-gradient:
          description: Second color for a two-color gradient fill
          type: string
        background-gradient:
          description: 'Full CSS gradient for the fill, e.g. linear-gradient(135deg, #f00 0%, #00f 60%, transparent 100%) — any number of stops at any angle, and radial-gradient or conic-gradient are accepted. Takes priority over background-color-gradient and is drawn on top of background-color'
          type: string
        background-gradient-direction:
          description: Direction of the gradient fill
          type: string
          enum:
          - left
          - right
          - top
          - bottom
        blur:
          description: Gaussian blur radius in pixels
          type: number
        border-color:
          description: border-color
          type: string
        border-radius:
          description: Border radius in pixels for rounded corners
          type: number
        border-style:
          description: border-style
          type: string
          enum:
          - none
          - solid
        border-width:
          description: border-width
          type: number
        box-shadow:
          description: box-shadow
          type: string
        clip-mode:
          description: How clip-to hides this layer. outline cuts it to the target's shape. alpha also fades it by the transparency of the target's fill — its background-gradient, or else its background-color — so a gradient running to transparent fades this layer out. Hide the target layer to use it as a mask only
          type: string
          enum:
          - outline
          - alpha
        clip-to:
          description: 'Id or name of another layer to clip this layer to — only the part inside that layer''s box is drawn, following its border-radius and rotation. Clips chain: a layer clipped to a layer that is itself clipped shows only inside both'
          type: string
        height:
          description: height
          type: number
        hidden:
          description: Hide or show this layer
          type: boolean
        left:
          description: left
          type: number
        opacity:
          description: Opacity from 0 (transparent) to 1 (opaque)
          type: number
        padding:
          description: padding
          type: number
        perspective:
          description: Perspective distance for 3D transforms in pixels
          type: number
        responsive-anchor-gap:
          description: How the anchor gap adjusts when the template is resized
          type: string
          enum:
          - none
          - scale
          - scale-x
          - scale-y
          - stretch
          - stretch-x
          - stretch-y
        responsive-aspect-ratio:
          description: responsive-aspect-ratio
          type: string
          enum:
          - free
          - locked
        responsive-position:
          description: How the layer repositions when the template is resized
          type: string
          enum:
          - none
          - scale
          - center-x
          - center-y
          - center
          - pin-right
          - pin-bottom
          - pin-right-bottom
          - center-x-pin-bottom
          - center-y-pin-right
        responsive-size:
          description: How the layer resizes when the template is resized
          type: string
          enum:
          - none
          - scale
          - stretch-x
          - stretch-y
          - stretch
        rotate:
          description: Rotation angle in degrees
          type: number
        rotateX:
          description: 3D rotation around the X axis in degrees
          type: number
        rotateY:
          description: 3D rotation around the Y axis in degrees
          type: number
        rotateZ:
          description: 3D rotation around the Z axis in degrees
          type: number
        top:
          description: top
          type: number
        width:
          description: width
          type: number
    LayerText:
      type: object
      description: A `text` layer.
      required:
      - id
      - type
      properties:
        id:
          type: string
          description: Unique layer id within the config
        type:
          type: string
          enum:
          - text
          description: Layer type discriminator
        name:
          type: string
          description: Optional human-readable layer name
        align-items:
          description: Vertical text alignment within the container
          type: string
          enum:
          - start
          - center
          - end
        anchor-gap-x:
