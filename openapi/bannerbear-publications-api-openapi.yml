    Keyframes:
      type: object
      description: Animation keyframes keyed by object id. Each value is an ordered array of keyframes for that object.
      additionalProperties:
        type: array
        items:
          type: object
          description: A single animation keyframe. Timing fields (delay/duration/endDelay) advance the object's timeline; any of the animatable attributes sets a target value the object tweens to over `duration` ms. Blank fields are ignored — omit any attribute you don't want to animate.
          properties:
            delay:
              type: integer
              minimum: 0
              maximum: 10000
              description: Milliseconds to wait after the previous frame ends before this frame's tween starts. Capped at 10000.
            duration:
              type: integer
              minimum: 0
              maximum: 10000
              description: Milliseconds the tween runs for. Must be > 0 for the frame to occupy time. Capped at 10000.
            endDelay:
              type: integer
              minimum: 0
              maximum: 10000
              description: Milliseconds to hold the frame's final state before the next frame's delay starts. Capped at 10000.
            easing:
              type: string
              enum:
              - linear
              - easeInQuad
              - easeOutQuad
              - easeInOutQuad
              - easeInCubic
              - easeOutCubic
              - easeInOutCubic
              - easeInQuart
              - easeOutQuart
              - easeInOutQuart
              - easeInQuint
              - easeOutQuint
              - easeInOutQuint
              - easeInSine
              - easeOutSine
              - easeInOutSine
              - easeInExpo
              - easeOutExpo
              - easeInOutExpo
              - easeInCirc
              - easeOutCirc
              - easeInOutCirc
              - easeInBack
              - easeOutBack
              - easeInOutBack
              - easeInBounce
              - easeOutBounce
              - easeInOutBounce
              - easeInElastic
              - easeOutElastic
              - easeInOutElastic
              description: anime.js easing function applied to this frame's tween. Defaults to easeInOutQuad.
            left:
              type: number
              description: Target x position in pixels
            top:
              type: number
              description: Target y position in pixels
            width:
              type: number
              minimum: 1
              description: Target width in pixels
            height:
              type: number
              minimum: 1
              description: Target height in pixels
            scale:
              type: number
              description: CSS scale multiplier (1 = no change)
            blur:
              type: number
              minimum: 0
              description: CSS blur radius in pixels
            opacity:
              type: number
              minimum: 0
              maximum: 1
              description: 0 (fully transparent) to 1 (fully opaque)
            rotate:
              type: number
              description: 2D rotation in degrees
            rotateX:
              type: number
              minimum: -180
              maximum: 180
              description: 3D rotation around the X axis in degrees
            rotateY:
              type: number
              minimum: -180
              maximum: 180
              description: 3D rotation around the Y axis in degrees
            rotateZ:
              type: number
              minimum: -360
              maximum: 360
              description: 3D rotation around the Z axis in degrees
            perspective:
              type: number
              minimum: 0
              maximum: 5000
              description: Perspective distance in pixels applied to the object's container. Required for rotateX/Y/Z to render as true 3D — without it, rotations appear flat.
            background-size:
              type: string
              description: CSS background-size value (e.g. `cover`, `contain`, `100% 100%`)
            background-position:
              type: string
              description: CSS background-position value (e.g. `50% 50%`, `top left`)
            text-effect:
              type: string
              enum:
              - FadeIn
              - FadeOut
              - ZoomIn
              - ZoomOut
              - GetBigger
              - GetSmaller
              - ScaleIn
              - ScaleOut
              - PopIn
              - PopOut
              description: Text layers only — cascades the named preset across each word in the text container. Ignored on non-text objects.
            text-effect-speed:
              oneOf:
              - type: string
                enum:
                - auto
              - type: integer
                enum:
                - 100
                - 200
                - 300
                - 400
                - 500
              description: Per-word stagger in ms. `auto` divides the frame's duration evenly across words.
            text-effect-easing:
              type: string
              enum:
              - linear
              - easeInQuad
              - easeOutQuad
              - easeInOutQuad
              - easeInCubic
              - easeOutCubic
              - easeInOutCubic
              - easeInQuart
              - easeOutQuart
              - easeInOutQuart
              - easeInQuint
              - easeOutQuint
              - easeInOutQuint
              - easeInSine
              - easeOutSine
              - easeInOutSine
              - easeInExpo
              - easeOutExpo
              - easeInOutExpo
              - easeInCirc
              - easeOutCirc
              - easeInOutCirc
              - easeInBack
              - easeOutBack
              - easeInOutBack
              - easeInBounce
              - easeOutBounce
              - easeInOutBounce
              - easeInElastic
              - easeOutElastic
              - easeInOutElastic
              description: Easing applied to each word's cascade. Falls back to the frame's `easing` if omitted.
