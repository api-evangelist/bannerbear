        anchor-to:
          description: Name of another layer to anchor this layer's position to
          type: string
        anchor-type:
          description: Whether to anchor to the container bounds or text bounds
          type: string
          enum:
          - container
          - text
        background-color:
          description: background-color
          type: string
        blur:
          description: Gaussian blur radius in pixels
          type: number
        border-color:
          description: border-color
          type: string
        border-radius:
          description: Border radius in pixels for rounded corners
          type: number
        border-style:
          description: border-style
          type: string
          enum:
          - none
          - solid
        border-width:
          description: border-width
          type: number
        box-shadow:
          description: box-shadow
          type: string
        clip-mode:
          description: How clip-to hides this layer. outline cuts it to the target's shape. alpha also fades it by the transparency of the target's fill — its background-gradient, or else its background-color — so a gradient running to transparent fades this layer out. Hide the target layer to use it as a mask only
          type: string
