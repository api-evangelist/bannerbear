        clip-to:
          description: 'Id or name of another layer to clip this layer to — only the part inside that layer''s box is drawn, following its border-radius and rotation. Clips chain: a layer clipped to a layer that is itself clipped shows only inside both'
          type: string
        color:
          description: color
          type: string
        color-secondary:
          description: Text color for text wrapped in *asterisks*
          type: string
        direction:
          description: direction
          type: string
          enum:
          - ltr
          - rtl
        font-family:
          description: Font family name (Google Fonts or custom font)
          type: string
        font-family-secondary:
          description: Font family for text wrapped in *asterisks*
          type: string
        font-size:
          description: font-size
