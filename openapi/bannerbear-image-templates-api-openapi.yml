openapi: 3.2.0
info:
  title: Bannerbear V5 Image Templates API
  version: '5.0'
servers:
- url: https://api.bannerbear.com/v5
  description: Async render host. All endpoints.
- url: https://sync.api.bannerbear.com/v5
  description: Synchronous render host. Only accepts POST /images — returns the finished image inline instead of a pending record. Long-running requests may return 408.
security:
- bearerAuth: []
tags:
- name: Image Templates
paths:
  /image_templates:
    get:
      summary: List image templates
      parameters:
      - name: page
        in: query
        schema:
          type: integer
        required: false
      responses:
        '200':
          description: Paginated list of templates
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  description: Image template. `config.objects` is the full canvas config — matches exactly the shape PATCH accepts, so responses round-trip cleanly.
                  properties:
                    uid:
                      type: string
                    name:
                      type: string
                    description:
                      type: string
                      nullable: true
                    tags:
                      type: array
                      items:
                        type: string
                    width:
                      type: integer
                    height:
                      type: integer
                    responsive:
                      type: boolean
                      description: True if the template has responsive sizing or positioning
                    preview:
                      type: string
                      nullable: true
                      format: uri
                      description: Preview image URL
                    ui_write_access:
                      type: string
                      enum:
                      - owner_only
                      - team
                      description: Who can edit this template in the dashboard — `owner_only` (default) or `team`
                    api_write_access:
                      type: string
                      enum:
                      - team
                      - owner_only
                      - nobody
                      description: Who can update or delete this template via the API — `team` (default, any workspace API key), `owner_only` (only API keys owned by the template's creator), or `nobody` (locked; unlock via dashboard)
                    config:
                      type: object
                      description: Full canvas configuration.
                      properties:
                        objects:
                          type: array
                          items:
                            $ref: '#/components/schemas/Layer'
                          description: Layers on the canvas
                    created_at:
                      type: string
                      format: date-time
      tags:
      - Image Templates
      operationId: getImageTemplates
      x-operation-id-source: derived
    post:
      summary: Create an image template
      description: Create a new image template in the workspace. Pass `config` to seed the canvas with layers; omit it to start from an empty template that can be edited later.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              properties:
                name:
                  type: string
                  description: Template name
                description:
                  type: string
                  nullable: true
                  description: Template description
                tags:
                  type: array
                  items:
                    type: string
                  description: Template tags
                width:
                  type: integer
                  description: Canvas width in pixels
                height:
                  type: integer
                  description: Canvas height in pixels
                config:
                  type: object
                  description: Full canvas configuration. Replaces the existing config in place.
                  properties:
                    objects:
                      type: array
                      items:
                        $ref: '#/components/schemas/Layer'
                      description: Layers on the canvas
      responses:
        '201':
          description: Template created
          content:
            application/json:
              schema:
                type: object
                description: Image template. `config.objects` is the full canvas config — matches exactly the shape PATCH accepts, so responses round-trip cleanly.
                properties:
                  uid:
                    type: string
                  name:
                    type: string
                  description:
                    type: string
                    nullable: true
                  tags:
                    type: array
                    items:
                      type: string
                  width:
                    type: integer
                  height:
                    type: integer
                  responsive:
                    type: boolean
                    description: True if the template has responsive sizing or positioning
                  preview:
                    type: string
                    nullable: true
                    format: uri
                    description: Preview image URL
                  ui_write_access:
                    type: string
                    enum:
                    - owner_only
                    - team
                    description: Who can edit this template in the dashboard — `owner_only` (default) or `team`
                  api_write_access:
                    type: string
                    enum:
                    - team
                    - owner_only
                    - nobody
                    description: Who can update or delete this template via the API — `team` (default, any workspace API key), `owner_only` (only API keys owned by the template's creator), or `nobody` (locked; unlock via dashboard)
                  config:
                    type: object
                    description: Full canvas configuration.
                    properties:
                      objects:
                        type: array
                        items:
                          $ref: '#/components/schemas/Layer'
                        description: Layers on the canvas
                  created_at:
                    type: string
                    format: date-time
        '400':
          description: Missing required parameter (e.g. name)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: Human-readable explanation of the error
        '422':
          description: Validation failure — e.g. width/height must be between 100 and 5000
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: Human-readable explanation of the error
      tags:
      - Image Templates
      operationId: postImageTemplates
      x-operation-id-source: derived
  /image_templates/{uid}:
    get:
      summary: Get an image template
      parameters:
      - name: uid
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Template details
          content:
            application/json:
              schema:
                type: object
                description: Image template. `config.objects` is the full canvas config — matches exactly the shape PATCH accepts, so responses round-trip cleanly.
                properties:
                  uid:
                    type: string
                  name:
                    type: string
                  description:
                    type: string
                    nullable: true
                  tags:
                    type: array
                    items:
                      type: string
                  width:
                    type: integer
                  height:
                    type: integer
                  responsive:
                    type: boolean
                    description: True if the template has responsive sizing or positioning
                  preview:
                    type: string
                    nullable: true
                    format: uri
                    description: Preview image URL
                  ui_write_access:
                    type: string
                    enum:
                    - owner_only
                    - team
                    description: Who can edit this template in the dashboard — `owner_only` (default) or `team`
                  api_write_access:
                    type: string
                    enum:
                    - team
                    - owner_only
                    - nobody
                    description: Who can update or delete this template via the API — `team` (default, any workspace API key), `owner_only` (only API keys owned by the template's creator), or `nobody` (locked; unlock via dashboard)
                  config:
                    type: object
                    description: Full canvas configuration.
                    properties:
                      objects:
                        type: array
                        items:
                          $ref: '#/components/schemas/Layer'
                        description: Layers on the canvas
                  created_at:
                    type: string
                    format: date-time
      tags:
      - Image Templates
      operationId: getImageTemplatesByUid
      x-operation-id-source: derived
    patch:
      summary: Update an image template
      description: Update any subset of template attributes. Passing `config` fully replaces the template's canvas configuration.
      parameters:
      - name: uid
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Template name
                description:
                  type: string
                  nullable: true
                  description: Template description
                tags:
                  type: array
                  items:
                    type: string
                  description: Template tags
                width:
                  type: integer
                  description: Canvas width in pixels
                height:
                  type: integer
                  description: Canvas height in pixels
                config:
                  type: object
                  description: Full canvas configuration. Replaces the existing config in place.
                  properties:
                    objects:
                      type: array
                      items:
                        $ref: '#/components/schemas/Layer'
                      description: Layers on the canvas
      responses:
        '200':
          description: Updated template
          content:
            application/json:
              schema:
                type: object
                description: Image template. `config.objects` is the full canvas config — matches exactly the shape PATCH accepts, so responses round-trip cleanly.
                properties:
                  uid:
                    type: string
                  name:
                    type: string
                  description:
                    type: string
                    nullable: true
                  tags:
                    type: array
                    items:
                      type: string
                  width:
                    type: integer
                  height:
                    type: integer
                  responsive:
                    type: boolean
                    description: True if the template has responsive sizing or positioning
                  preview:
                    type: string
                    nullable: true
                    format: uri
                    description: Preview image URL
                  ui_write_access:
                    type: string
                    enum:
                    - owner_only
                    - team
                    description: Who can edit this template in the dashboard — `owner_only` (default) or `team`
                  api_write_access:
                    type: string
                    enum:
                    - team
                    - owner_only
                    - nobody
                    description: Who can update or delete this template via the API — `team` (default, any workspace API key), `owner_only` (only API keys owned by the template's creator), or `nobody` (locked; unlock via dashboard)
                  config:
                    type: object
                    description: Full canvas configuration.
                    properties:
                      objects:
                        type: array
                        items:
                          $ref: '#/components/schemas/Layer'
                        description: Layers on the canvas
                  created_at:
                    type: string
                    format: date-time
        '400':
          description: No editable attributes provided
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: Human-readable explanation of the error
        '403':
          description: Template's api_write_access is `owner_only` and the caller's API key is not owned by the template's creator
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: Human-readable explanation of the error
        '404':
          description: Template not found in this workspace
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: Human-readable explanation of the error
        '422':
          description: Validation failure — e.g. width/height must be between 100 and 5000
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: Human-readable explanation of the error
        '423':
          description: Template's api_write_access is `nobody` — the owner must unlock it via the dashboard
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: Human-readable explanation of the error
      tags:
      - Image Templates
      operationId: patchImageTemplatesByUid
      x-operation-id-source: derived
    delete:
      summary: Delete an image template
      description: Soft-deletes the template. Existing renders that reference it stay intact, but the template will no longer appear in list/get calls and can no longer be used for new renders.
      parameters:
      - name: uid
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Template deleted
        '403':
          description: Template's api_write_access is `owner_only` and the caller's API key is not owned by the template's creator
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: Human-readable explanation of the error
        '423':
          description: Template's api_write_access is `nobody` — the owner must unlock it via the dashboard
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: Human-readable explanation of the error
      tags:
      - Image Templates
      operationId: deleteImageTemplatesByUid
      x-operation-id-source: derived
components:
  schemas:
    LayerCircle:
      type: object
      description: A `circle` layer.
      required:
      - id
      - type
      properties:
        id:
          type: string
          description: Unique layer id within the config
        type:
          type: string
          enum:
          - circle
          description: Layer type discriminator
        name:
          type: string
          description: Optional human-readable layer name
        anchor-gap-x:
          description: Horizontal offset from the anchor point in pixels
          type: number
        anchor-gap-y:
          description: Vertical offset from the anchor point in pixels
          type: number
        anchor-point:
          description: Which point on the target layer to anchor to
          type: string
          enum:
          - top-left
          - top-center
          - top-right
          - center-left
          - center
          - center-right
          - bottom-left
          - bottom-center
          - bottom-right
        anchor-to:
          description: Name of another layer to anchor this layer's position to
          type: string
        anchor-type:
          description: Whether to anchor to the container bounds or text bounds
          type: string
          enum:
          - container
          - text
        aspect-ratio-locked:
          description: aspect-ratio-locked
          type: boolean
        background-color:
          description: Background color of the container
          type: string
        background-color-gradient:
          description: Second color for a two-color gradient fill
          type: string
        background-gradient:
          description: 'Full CSS gradient for the fill, e.g. linear-gradient(135deg, #f00 0%, #00f 60%, transparent 100%) — any number of stops at any angle, and radial-gradient or conic-gradient are accepted. Takes priority over background-color-gradient and is drawn on top of background-color'
          type: string
        background-gradient-direction:
          description: Direction of the gradient fill
          type: string
          enum:
          - left
          - right
          - top
          - bottom
        blur:
          description: Gaussian blur radius in pixels
          type: number
        border-color:
          description: border-color
          type: string
        border-radius:
          description: Border radius in pixels for rounded corners
          type: number
        border-style:
          description: border-style
          type: string
          enum:
          - none
          - solid
        border-width:
          description: border-width
          type: number
        box-shadow:
          description: box-shadow
          type: string
        clip-mode:
          description: How clip-to hides this layer. outline cuts it to the target's shape. alpha also fades it by the transparency of the target's fill — its background-gradient, or else its background-color — so a gradient running to transparent fades this layer out. Hide the target layer to use it as a mask only
          type: string
          enum:
          - outline
          - alpha
        clip-to:
          description: 'Id or name of another layer to clip this layer to — only the part inside that layer''s box is drawn, following its border-radius and rotation. Clips chain: a layer clipped to a layer that is itself clipped shows only inside both'
          type: string
        height:
          description: height
          type: number
        hidden:
          description: Hide or show this layer
          type: boolean
        left:
          description: left
          type: number
        opacity:
          description: Opacity from 0 (transparent) to 1 (opaque)
          type: number
        padding:
          description: padding
          type: number
        perspective:
          description: Perspective distance for 3D transforms in pixels
          type: number
        responsive-anchor-gap:
          description: How the anchor gap adjusts when the template is resized
          type: string
          enum:
          - none
          - scale
          - scale-x
          - scale-y
          - stretch
          - stretch-x
          - stretch-y
        responsive-aspect-ratio:
          description: responsive-aspect-ratio
          type: string
          enum:
          - free
          - locked
        responsive-position:
          description: How the layer repositions when the template is resized
          type: string
          enum:
          - none
          - scale
          - center-x
          - center-y
          - center
          - pin-right
          - pin-bottom
          - pin-right-bottom
          - center-x-pin-bottom
          - center-y-pin-right
        responsive-size:
          description: How the layer resizes when the template is resized
          type: string
          enum:
          - none
          - scale
          - stretch-x
          - stretch-y
          - stretch
        rotate:
          description: Rotation angle in degrees
          type: number
        rotateX:
          description: 3D rotation around the X axis in degrees
          type: number
        rotateY:
          description: 3D rotation around the Y axis in degrees
          type: number
        rotateZ:
          description: 3D rotation around the Z axis in degrees
          type: number
        top:
          description: top
          type: number
        width:
          description: width
          type: number
    LayerText:
      type: object
      description: A `text` layer.
      required:
      - id
      - type
      properties:
        id:
          type: string
          description: Unique layer id within the config
        type:
          type: string
          enum:
          - text
          description: Layer type discriminator
        name:
          type: string
          description: Optional human-readable layer name
        align-items:
          description: Vertical text alignment within the container
          type: string
          enum:
          - start
          - center
          - end
        anchor-gap-x:
          description: Horizontal offset from the anchor point in pixels
          type: number
        anchor-gap-y:
          description: Vertical offset from the anchor point in pixels
          type: number
        anchor-point:
          description: Which point on the target layer to anchor to
